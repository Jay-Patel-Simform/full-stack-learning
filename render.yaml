# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  # ---------- the API: the Dockerfile from lesson 52 ----------
  - type: web
    name: full-stack-learning
    runtime: docker
    plan: free
    # the region you picked in lesson 56
    region: singapore
    # same as the dashboard's "Root Directory"
    rootDir: server
    # ! relative to rootDir, not to the repo root
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # decisions: safe to read, and worth reading
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      # lesson 56: without this the port scan times out
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: AUDIT_RETENTION_DAYS
        value: "90"
      # secrets: the NAME is here, the VALUE is asked for in the dashboard
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      # not a secret, but it is a URL you cannot know until the site below exists
      - key: ALLOWED_ORIGINS
        sync: false

  # ---------- the page: the static site from lesson 57 ----------
  - type: web
    name: tracker-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # lesson 57. A build-time value, and public by design
      - key: VITE_API_URL
        value: /api
    # lesson 62: the browser enforces this, not the server.
    headers:
      # Report-Only: the browser reports violations and blocks nothing.
      # Rename to Content-Security-Policy once the console is clean.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; report-uri /api/csp-report"
      # the Referer sent to other sites: origin only, never the path
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # an allowlist of device APIs. Empty () means "nobody, not even me"
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # lesson 64: the filename IS the guarantee. index-D1HMFRqX.js can never
      # mean different bytes, so never re-ask. index.html is left alone on
      # purpose: fixed name, changing bytes, must always be re-checked.
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      # ! Order matters, exactly as in the dashboard. /api/* first, or the
      # ! SPA rule below swallows every API call and answers with index.html.
      - type: rewrite
        source: /api/*
        destination: https://full-stack-learning-mmty.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
