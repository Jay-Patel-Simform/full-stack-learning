# Same-origin deployment. One origin: https://app.example
#
# The browser only ever sees ONE origin, so:
#   - no CORS at all (no Origin header is cross-origin)
#   - the session cookie is first-party, SameSite=Lax keeps working
#   - ALLOWED_ORIGINS can be empty in production
#
# Run the API on 127.0.0.1:3000 - NOT on a public port. nginx is the only
# thing that can reach it.

server {
  listen 443 ssl;
  server_name app.example;

  # ssl_certificate     /etc/letsencrypt/live/app.example/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/app.example/privkey.pem;

  # 1. The API. Everything under /api goes to Fastify.
  location /api/ {
    # trailing slash on proxy_pass strips the /api prefix:
    #   /api/auth/me  ->  GET /auth/me
    proxy_pass http://127.0.0.1:3000/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 2. The built React app. Static files, SPA fallback.
  root /var/www/app;
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# The gotcha this file used to only warn about, now handled:
# Fastify sees every request coming from 127.0.0.1, so request.ip is the proxy
# and the IP rate limit becomes one shared bucket for the whole internet.
# src/app.ts reads TRUST_PROXY, so run the API with:
#
#   NODE_ENV=production TRUST_PROXY=true PORT=3000 npm start
#
# NODE_ENV=production also turns on HSTS and the Secure flag on the session
# cookie. Leave TRUST_PROXY unset anywhere the API is reachable directly -
# otherwise anyone can forge X-Forwarded-For and dodge the limit.
